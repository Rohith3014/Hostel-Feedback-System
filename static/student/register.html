<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Register — Hostel Feedback System</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    :root { --primary: #0d9488; }
    body { background: var(--student-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem 1rem; }
    .auth-box { background: #fff; border: 1px solid var(--border); border-radius: .75rem; padding: 2rem; width: 100%; max-width: 440px; box-shadow: var(--shadow-md); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo .icon { font-size: 2.5rem; }
    .auth-logo h1 { font-size: 1.4rem; font-weight: 700; margin-top: .4rem; }
    .auth-logo p  { font-size: .85rem; color: var(--text-muted); }
    .auth-footer  { text-align: center; margin-top: 1rem; font-size: .875rem; color: var(--text-muted); }
    .auth-footer a { color: var(--student-primary); font-weight: 500; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .back-link { display: inline-flex; align-items: center; gap: .3rem; color: var(--text-muted); font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div style="width:100%;max-width:440px">
    <a href="/student/login.html" class="back-link">← Back to login</a>
    <div class="auth-box">
      <div class="auth-logo">
        <div class="icon">🎓</div>
        <h1>Create Account</h1>
        <p>Register with your hostel details</p>
      </div>

      <div id="alert-area"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your full name" required/>
        </div>
        <div class="two-col">
          <div class="form-group">
            <label for="usn">USN</label>
            <input type="text" id="usn" placeholder="1IC25AI065" required/>
          </div>
          <div class="form-group">
            <label for="room_number">Room Number</label>
            <input type="text" id="room_number" placeholder="A-101" required/>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" placeholder="9876543210"/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required minlength="6"/>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn" style="background:var(--student-primary)">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/student/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Registering…';

      try {
        await API.post("/api/auth/register", {
          name:        document.getElementById("name").value.trim(),
          usn:         document.getElementById("usn").value.trim(),
          email:       document.getElementById("email").value.trim(),
          phone:       document.getElementById("phone").value.trim(),
          room_number: document.getElementById("room_number").value.trim(),
          password:    document.getElementById("password").value,
        });
        showAlert(document.getElementById("alert-area"), "Account created! Redirecting to login…", "success");
        setTimeout(() => window.location.href = "/student/login.html", 1500);
      } catch (err) {
        showAlert(document.getElementById("alert-area"), err.message);
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
